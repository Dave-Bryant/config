  - title: Irrigation
    cards:
      - type: markdown
        title: Last scheduled run per zone
        content: |
          {% set zones = [
            ('Front lawn west','1_front_lawn','1_front_lawn'),
            ('Front lawn east','2_front_lawn_left','2_front_lawn_left'),
            ('Back lawn south','3_back_lawn_south','3_back_lawn_south'),
            ('Back lawn north','4_back_lawn_north','4_back_lawn_north'),
            ('Back & west gardens','6_west_side_back_gardens','6_west_side_back_gardens'),
            ('East & front gardens','7_east_side_front_gardens','7_east_side_front_gardens')] %}
          | Zone | Status | Time | Date | Duration |
          |---|---|---|---|---|
          {% for name, key, _ in zones -%}
          {% set st = states('sensor.opensprinkler_' ~ key ~ '_station_status') -%}
          {% set en = is_state('switch.opensprinkler_' ~ key ~ '_station_enabled', 'on') -%}
          {% set base = 'input_text.opensprinkler_' ~ key ~ '_station_enabled_run_' -%}
          {% set secs = states(base ~ 'duration') | int(0) -%}
          {% if not en %}{% set col = '🔴' %}{% set txt = 'disabled' -%}
          {% elif st in ['unavailable','unknown'] %}{% set col = '🔴' %}{% set txt = st -%}
          {% elif st == 'idle' %}{% set col = '⚪' %}{% set txt = 'idle' -%}
          {% elif st in ['waiting','queued'] %}{% set col = '🟠' %}{% set txt = st -%}
          {% else %}{% set col = '🟢' %}{% set txt = 'running (' ~ st ~ ')' -%}
          {% endif -%}
          | {{ name }} | {{ col }} **{{ txt }}** | {{ states(base ~ 'time') }} | {{ states(base ~ 'date') }} | {{ secs // 60 }}m {{ secs % 60 }}s |
          {% endfor %}
      - type: entities
        title: 'Watering & Evapotranspiration'
        entities:
          - entity: input_number.garden_watering_time
            icon: 'mdi:clock'
            secondary_info: last-changed
            name: Garden Watering Time            
          - entity: input_number.lawn_watering_time
            name: Lawn Watering Time
            icon: 'mdi:clock' 
            secondary_info: last-changed 
          - entity: input_number.daily_calc_et
            name: Calc. Evapotranspiration 
            icon: 'mdi:cloud-outline'       
          - entity: input_number.daily_rain_event
            name: Rain Bucket remaining 
            icon: 'mdi:cloud-outline'      
          - entity: input_number.daily_et
            name: Daily Evapo. (after bucket) 
            icon: 'mdi:cloud-outline'          
          - entity: input_select.irrigation_status
            #name: false
      
  - title: Weather
    cards:
      - type: custom:apexcharts-card
        header:
          show: true
          title: Precipitation & Temperature
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.ws2900c_v2_01_10_daily_rain
            name: 'Precipitation' 
            color: blue
            type: line
            stroke_width: 2
            extend_to: false
            group_by:
              duration: 1d
              func: avg
          - entity: sensor.soil_moisture_2_soil_moisture
            name: 'Soil Moisture' 
            color: green
            type: line
            stroke_width: 2
            extend_to: false
            group_by:
              duration: 1d
              func: avg
          - entity: input_number.daily_calc_et
            name: 'Daily Evapo' 
            color: yellow
            type: line
            stroke_width: 2
            extend_to: false
            group_by:
              duration: 1d
              func: avg
           
          - entity: sensor.ws2900c_v2_01_10_outdoor_temperature
            name: 'Temperature'
            color: red
            type: line
            stroke_width: 2
            extend_to: false
        graph_span: 14d
        span:
          end: day
      
          
          

      - type: 'custom:card-templater'
        card:
          type: entities
          title: Weather Overview
          entities:
            - entity: sensor.pws_forecast_narrative_today
              icon: 'mdi:weather-sunny'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_today") | truncate(8,true,' ')
                }}
            - entity: sensor.pws_forecast_narrative_tonight
              icon: 'mdi:weather-night'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_tonight") | truncate(10,true,'
                ')  }}
            - entity: sensor.pws_forecast_narrative_tomorrow
              icon: 'mdi:weather-sunny'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_tomorrow") | truncate(11,true,'
                ')  }}
            - entity: sensor.pws_forecast_narrative_tomorrow_tonight
              icon: 'mdi:weather-night'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_tomorrow_tonight") |
                truncate(20,true,' ') }}
        entities:
          - entity: sensor.pws_forecast_narrative_today
            state_template: >-
              {% set first_word =  states("sensor.pws_forecast_narrative_today") |  truncate(8,true,' ')%}
              {% if first_word | trim  == 'Waiting' %}
              {{ states("sensor.pws_forecast_narrative_today") | truncate(8,true,' ') | trim }}
              {%- else -%}
              {{states("sensor.pws_forecast_narrative_today") | regex_replace(find='Today', replace=' ', ignorecase=False) }}
              {% endif %}
          - entity: sensor.pws_forecast_narrative_tonight
            state_template: >-
              {{ states("sensor.pws_forecast_narrative_tonight") |
              regex_replace(find='Tonight', replace=' ', ignorecase=False)   }}
          - entity: sensor.pws_forecast_narrative_tomorrow
            state_template: >-
              {{ states("sensor.pws_forecast_narrative_tomorrow") |
              regex_replace(find='Tomorrow', replace=' ', ignorecase=False)  }}
          - entity: sensor.pws_forecast_narrative_tomorrow_tonight
            state_template: >-
              {{ states("sensor.pws_forecast_narrative_tomorrow_tonight") |
              regex_replace(find='Tomorrow night', replace=' ', ignorecase=False)  }}
        entity: sensor.pws_forecast_narrative_tonight

      
      - type: entities
        title: 'Daily Forecast'
        entities:
          - entity: sensor.precip_chance_today # from REST PWS
            icon: 'mdi:weather-pouring'
          - entity: sensor.precip_chance_tomorrow # from REST PWS
