no-top-header:
  card-mod-theme: no-top-header
  card-mod-root: |
    app-toolbar {
      display: none;
    }

swipe_nav:
  wrap: true
  animate: swipe
  prevent_default: true
  swipe_amount: 15

views:
  - title: Home
    background: var(--background-image)
    badges:
      - entity: binary_sensor.home_assistant_versions_update_available
        name: Update?
      - entity: person.david_bryant
        name: David
        display_type: complete
      - entity: person.wendy_bryant
        name: Wendy
        display_type: complete      
      - type: entity
        #name: noone home
        #display_type: complete
        #state_content: name
        entity: zone.home  
        #state_filter:
         # - operator: "=="
          #  value: 0
  

    cards:
      
      - type: vertical-stack
        cards:
        - type: horizontal-stack
          cards:
            - type: 'custom:button-card'
              entity: light.osram_light_family_room
              name: Family Room
              icon: 'mdi:lightbulb'
              aspect_ratio: 1.5/1
              color: auto
              state:
                - value: 'on'
                  color: rgb(255, 255, 0)
              label: |
                [[[
                    var bri = (states['light.osram_light_family_room'].attributes.brightness / 254 * 100).toFixed(0);
                    if (isNaN(bri))
                      return 'Brightness: ' + '0' + '%';
                    else
                      return 'Brightness: ' + (bri ? bri : '0') + '%';
                ]]]
              show_label: true
              size: 30%
              styles:
                card:
                  - height: 60px
                  - font-size: 12px
            - type: 'custom:button-card'
              entity: light.osram_light_holly
              name: Hollys Bedroom
              icon: 'mdi:lightbulb'
              aspect_ratio: 1.5/1
              color: auto
              state:
                - value: 'on'
                  color: rgb(255, 255, 0)
              label: |
                [[[
                    var bri = (states['light.osram_light_holly'].attributes.brightness / 254 * 100).toFixed(0);
                    if (isNaN(bri))
                      return 'Brightness: ' + '0' + '%';
                    else
                      return 'Brightness: ' + (bri ? bri : '0') + '%';
                ]]]
              show_label: true
              size: 30%
              styles:
                card:
                  - height: 60px
                  - font-size: 12px
            - type: 'custom:button-card'
              entity: light.osram_light_spare_bedroom
