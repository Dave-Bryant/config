  - title: Weather
    cards:
      - type: custom:apexcharts-card
        header:
          show: true
          title: Precipitation & Temperature
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.ws2900c_v2_01_10_daily_rain
            name: 'Precipitation' 
            color: blue
            type: line
            stroke_width: 2
            extend_to: false
            group_by:
              duration: 1d
              func: avg
          - entity: sensor.soil_moisture_2_soil_moisture
            name: 'Soil Moisture' 
            color: green
            type: line
            stroke_width: 2
            extend_to: false
            group_by:
              duration: 1d
              func: avg
          - entity: input_number.daily_calc_et
            name: 'Daily Evapo' 
            color: yellow
            type: line
            stroke_width: 2
            extend_to: false
            group_by:
              duration: 1d
              func: avg
           
          - entity: sensor.ws2900c_v2_01_10_outdoor_temperature
            name: 'Temperature'
            color: red
            type: line
            stroke_width: 2
            extend_to: false
        graph_span: 14d
        span:
          end: day
      
          
          

      - type: 'custom:card-templater'
        card:
          type: entities
          title: Weather Overview
          entities:
            - entity: sensor.pws_forecast_narrative_today
              icon: 'mdi:weather-sunny'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_today") | truncate(8,true,' ')
                }}
            - entity: sensor.pws_forecast_narrative_tonight
              icon: 'mdi:weather-night'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_tonight") | truncate(10,true,'
                ')  }}
            - entity: sensor.pws_forecast_narrative_tomorrow
              icon: 'mdi:weather-sunny'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_tomorrow") | truncate(11,true,'
                ')  }}
            - entity: sensor.pws_forecast_narrative_tomorrow_tonight
              icon: 'mdi:weather-night'
              name_template: >-
                {{ states("sensor.pws_forecast_narrative_tomorrow_tonight") |
                truncate(20,true,' ') }}
        entities:
          - entity: sensor.pws_forecast_narrative_today
            state_template: >-
              {% set first_word =  states("sensor.pws_forecast_narrative_today") |  truncate(8,true,' ')%}
              {% if first_word | trim  == 'Waiting' %}
              {{ states("sensor.pws_forecast_narrative_today") | truncate(8,true,' ') | trim }}
              {%- else -%}
              {{states("sensor.pws_forecast_narrative_today") | regex_replace(find='Today', replace=' ', ignorecase=False) }}
              {% endif %}
          - entity: sensor.pws_forecast_narrative_tonight
            state_template: >-
              {{ states("sensor.pws_forecast_narrative_tonight") |
              regex_replace(find='Tonight', replace=' ', ignorecase=False)   }}
          - entity: sensor.pws_forecast_narrative_tomorrow
            state_template: >-
              {{ states("sensor.pws_forecast_narrative_tomorrow") |
              regex_replace(find='Tomorrow', replace=' ', ignorecase=False)  }}
          - entity: sensor.pws_forecast_narrative_tomorrow_tonight
            state_template: >-
              {{ states("sensor.pws_forecast_narrative_tomorrow_tonight") |
              regex_replace(find='Tomorrow night', replace=' ', ignorecase=False)  }}
        entity: sensor.pws_forecast_narrative_tonight

      
      - type: entities
        title: 'Daily Forecast'
        entities:
          - entity: sensor.precip_chance_today # from REST PWS
            icon: 'mdi:weather-pouring'
          - entity: sensor.precip_chance_tomorrow # from REST PWS
            icon: 'mdi:weather-pouring'
          - entity: sensor.ws2900c_v2_01_10_daily_rain # correct
            name: 'daily rain'
          - entity: sensor.ws2900c_v2_01_10_event_rain
            name: 'rain event precipitation'
          - type: section
          - entity: sensor.ws2900c_v2_01_10_outdoor_temperature # Correct
            name: 'outside temperature'
          - entity: sensor.ws2900c_v2_01_10_feels_like_temperature
            name: 'outside temperature feels like'           
          - entity: sensor.high_temperature_today # from config then Ecowitt
            name: 'maximum temperature today'
          - entity: sensor.low_temperature_today
            name: 'minimum temperature today'
          - type: section          
          - entity: sensor.ws2900c_v2_01_10_uv_index
            name: 'UV index(>3 needs protection)'
          - entity: sensor.ws2900c_v2_01_10_solar_radiation # correct
            name: 'solar radiation'
          - type: section          
          - entity: sensor.ws2900c_v2_01_10_dewpoint # correct
            name: 'dew point'          
          - entity: sensor.ws2900c_v2_01_10_wind_speed  # correct          
            name: 'wind speed'
          - entity: sensor.ws2900c_v2_01_10_humidity  # correct
            name: 'humidity'
          - entity: sensor.ws2900c_v2_01_10_relative_pressure # correct
            name: 'relative air pressure'

      - type: 'custom:bom-radar-card'
        frame_count: 10
        center_latitude: -35.282000
        center_longitude: 149.1287
        show_marker: true
        show_range: true
        show_zoom: true
        show_recenter: true
        show_playback: true
        map_style: 'satellite'
        zoom_level: 8

      - type: iframe
        url: >-
          https://app.powerbi.com/view?r=eyJrIjoiY2MwMDVlYjYtYjRiMS00ZWYwLWIzN2QtNWM3OTU0YThkOWMyIiwidCI6ImE4ODBjY2UwLWI4NjYtNGU3YS1hMjNmLWVmNWE3NTU0NzFkMyJ9
        aspect_ratio: 90%      
  

