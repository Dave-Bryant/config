
# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

bluetooth:

recorder:
  db_url: !secret mariadb_password
  purge_keep_days: 60
  exclude:
    entity_globs:
      - sensor.wupws_weather*          # old sensors
      - sensor.pws_forecast_*          # REST forecast blobs (precip + narrative)
      - binary_sensor.ewelink*         # motion sensors
      # - sensor.spare_switch_2*       # power consumption
      - number.*                       # musicast
      - sensor.watchman*
      - sensor.flightradar24*
      - sensor.roof_pi*
      - sensor.garage_pi*
      - sensor.node_rpi*_total_updates # large APT package list attributes
      - sensor.odroidn2_*              # MQTT infra — in InfluxDB
      # - sensor.*
    entities:
      - sensor.garage_pi_sensors_garage_pi_last_message
      - sensor.orangepi5_cpu_temp               # MQTT infra — in InfluxDB
      - sensor.high_temperature_today           # statistics — source already recorded
      - sensor.high_temperature_per_hour
      - sensor.low_temperature_today
      - sensor.low_temperature_per_hour
      - sensor.wendys_min_temperature_today
      - sensor.high_relative_humidity_per_hour
      - sensor.low_relative_humidity_per_hour
      - sensor.garden_watering_time_mins        # unit-conversion template
      - sensor.lawn_watering_time_mins
      - sensor.cluster_status                   # binary UP/DOWN string
      - sensor.esp32_temperature_smoothed       # derived from recorded source
      - sensor.esp32_temperature_safe           # numeric wrapper for filter input

influxdb:
  host: a0d7b954-influxdb  
  port: 8086
  database: homeassistant
  username: homeassistant
  password: !secret influxdb_password
  max_retries: 3
  default_measurement: state
  include:
    # entities:
    #   - sensor.helium_wallet_14rtp7ja84zcvwsu6nuf6kbbfwam3qezuulzgvypk1n3jpkdqqu
    #   - sensor.helium_hnt_oracle_price
    #   - sensor.helium_wallet_today
    #   - sensor.helium_wallet_weekly
    #   - sensor.helium_wallet_monthly
    #   - sensor.helium_wallet_value
    domains:
      - sensor
  exclude:
    entities:
    - sensor.garage_pi_sensors_garage_pi_last_message
    entity_globs:     
     - sensor.wupws_weather* # old sensors
     - sensor.pws_forecast_narrative* # just words
     - sensor.watchman*

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  resources:
    - type: module
      url: /hacsfiles/canvas-gauge-card/canvas-gauge-card.js
    - type: module
      url: /hacsfiles/lovelace-card-templater/lovelace-card-templater.js
    - type: module
      url: /hacsfiles/lovelace-multiple-entity-row/multiple-entity-row.js
    - type: module
      url: /hacsfiles/button-card/button-card.js
    - type: module
      url: /hacsfiles/bom-radar-card/bom-radar-card.js
    - type: module
      url: /hacsfiles/hass-swipe-navigation/swipe-navigation.js
    - type: module
      url: /hacsfiles/uptime-card/uptime-card.js
    - type: module
      url: /hacsfiles/apexcharts-card/apexcharts-card.js?v=2.0.1
    - type: module
      url: /hacsfiles/vacuum-card/vacuum-card.js
    - type: module
      url: /hacsfiles/mini-climate-card/mini-climate-card-bundle.js?v=2.2.1
    - type: module
      url: /hacsfiles/vertical-stack-in-card/vertical-stack-in-card.js
    - type: module
      url: /hacsfiles/opensprinkler-card/opensprinkler-card.js
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

logger:
  default: warn
  logs:
    #custom_components.samsungtv_tizen: error    
    #homeassistant.components.media_player: error
    #homeassistant.components.pychromecast: error
    custom_components.mbapi2020: error
    deebot_client: critical
    # custom_components.proxmoxve: debug

ffmpeg:

tts:
  - platform: google_translate
    
mqtt:
  sensor:
    - name: 'odroidn2_cpu_load'
      state_topic: 'glances/odroid/cpu'
      value_template: '{{ value_json.total }}'
      unit_of_measurement: '%'
    - name: 'odroidn2_mem_load'
      state_topic: 'glances/odroid/mem'
      value_template: '{{ value_json.percent }}'
      unit_of_measurement: '%'
    - name: 'odroidn2_cpu_temp'
      state_topic: 'glances/odroid/sensors'
      value_template: '{{ value_json["soc_thermal 0"]["value"] }}'
      unit_of_measurement: 'C'
    - name: "OrangePi5 CPU Temp"
      state_topic: "orangepi5/temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

sensor:    
  - platform: statistics
    entity_id: sensor.ws2900c_v2_01_10_outdoor_temperature
    name: "high_temperature_today"
    state_characteristic: value_max
    max_age:
      minutes: 1440
    sampling_size: 288
  - platform: statistics
    entity_id: sensor.ws2900c_v2_01_10_outdoor_temperature
    name: "high_temperature_per_hour"
    state_characteristic: value_max
    max_age:
      minutes: 60
    sampling_size: 12
  - platform: statistics
    entity_id: sensor.ws2900c_v2_01_10_outdoor_temperature
    name: "low_temperature_today"
    state_characteristic: value_min
    max_age:
      minutes: 1440
    sampling_size: 288
  - platform: statistics
    entity_id: sensor.ws2900c_v2_01_10_outdoor_temperature
    name: "low_temperature_per_hour"
    state_characteristic: value_min
    max_age:
      minutes: 60
    sampling_size: 12
  - platform: statistics
    entity_id: sensor.wendys_bedroom_temp
    name: "Wendys Min Temperature today"
    state_characteristic: value_min
    max_age:
      minutes: 1440
    sampling_size: 288
  - platform: statistics
    entity_id: sensor.ws2900c_v2_01_10_humidity
    name: "high_relative_humidity_per_hour"
    state_characteristic: value_max
    max_age:
      minutes: 60
    sampling_size: 12
  - platform: statistics
    entity_id: sensor.ws2900c_v2_01_10_humidity
    name: "low_relative_humidity_per_hour"
    state_characteristic: value_min
    max_age:
      minutes: 60
    sampling_size: 12
  
  - platform: min_max   # for the REST Forecast
    name: "precip_chance_today"
    type: max
    entity_ids:
      - sensor.pws_forecast_today
      - sensor.pws_forecast_tonight
  - platform: min_max
    name: "precip_chance_tomorrow"
    type: max
    entity_ids:
      - sensor.pws_forecast_tomorrow
      - sensor.pws_forecast_tomorrow_tonight
    
 # Old config
  # - platform: command_line
  #   name: CPU Temperature
  #   command: "cat /sys/class/thermal/thermal_zone0/temp"
  #   unit_of_measurement: "°C"
  #   value_template: "{{ (value | default(0) | float) * 0.001 | round(1) }}"
  #   scan_interval: 30

  - platform: filter
    name: "ESP32 Temperature Smoothed"
    entity_id: sensor.esp32_temperature_safe
    filters:
      - filter: outlier
        window_size: 4
        radius: 2.0
      - filter: time_simple_moving_average
        window_size: "00:05"    # 5-minute
        precision: 1  

# command_line:
#   - sensor:
#       name: CPU Temperature
#       command: 'cat /sys/class/thermal/thermal_zone0/temp'
#       unit_of_measurement: '°C'
#       value_template: '{{ (value | default(0) | float) * 0.001 | round(1) }}'
#       scan_interval: 30


template:
- sensor:
  - unit_of_measurement: AUD
    default_entity_id: sensor.ev_charge_cost
    state: '{{ (states(''sensor.spare_switch_2_today_s_consumption'') | float(0)  *
      0.16812 | float(0)) | round(2) }}'
    name: ev_charge_cost

 # UPS Runtime
- sensor:
  - name: ups_estimated_runtime
    unit_of_measurement: "minutes"
    default_entity_id: sensor.ups_estimated_runtime        
    state: '{{ ((70.2 / ((states(''sensor.myups_load'') | float(0) / 100) * 480)) * 60 * 0.5) | int }}'
  
 # Irrigation Time Sensors
- sensor:
  - unit_of_measurement: min
    default_entity_id: sensor.garden_watering_time_mins
    state: '{{ (states(''input_number.garden_watering_time'') | float(0)  / 60 | float(0))
      | round(2) }}'
    name: garden_watering_time_mins
- sensor:
  - unit_of_measurement: min
    default_entity_id: sensor.lawn_watering_time_mins
    state: '{{ (states(''input_number.lawn_watering_time'') | float(0)  / 60 | float(0))
      | round(2) }}'
    name: lawn_watering_time_mins

 # A/C sensors  
- sensor:
  - unit_of_measurement: °C
    device_class: temperature
    default_entity_id: sensor.study_temp
    name: Study temperature
    state: '{{ state_attr(''climate.study'', ''current_temperature'') }}'
- sensor:
  - unit_of_measurement: '%'
    device_class: humidity
    default_entity_id: sensor.study_humidity
    name: Study humidity
    state: '{{ state_attr(''climate.study'', ''current_humidity'') }}'
- sensor:
  - default_entity_id: sensor.study_fan_modes
    name: Study fan modes
    state: '{{ state_attr(''climate.study'', ''fan_mode'') }}'
- sensor:
  - unit_of_measurement: °C
    device_class: temperature
    default_entity_id: sensor.hollys_bedroom_temp
    name: Hollys bedroom temperature
    state: '{{ state_attr(''climate.hollys_bedroom'', ''current_temperature'') }}'
- sensor:
  - unit_of_measurement: '%'
    device_class: humidity
    default_entity_id: sensor.hollys_bedroom_humidity
    name: Hollys bedroom humidity
    state: '{{ state_attr(''climate.hollys_bedroom'', ''current_humidity'') }}'
- sensor:
  - unit_of_measurement: °C
    device_class: temperature
    default_entity_id: sensor.wendys_bedroom_temp
    name: Wendys bedroom temperature
    state: '{{ state_attr(''climate.wendys_bedroom'', ''current_temperature'') }}'
- sensor:
  - unit_of_measurement: '%'
    device_class: humidity
    default_entity_id: sensor.wendys_bedroom_humidity
    name: Wendys bedroom humidity
    state: '{{ state_attr(''climate.wendys_bedroom'', ''current_humidity'') }}'
- sensor:
  - unit_of_measurement: °C
    device_class: temperature
    default_entity_id: sensor.family_room_temp
    name: Family room temperature
    state: '{{ state_attr(''climate.family_room'', ''current_temperature'') }}'
- sensor:
  - unit_of_measurement: '%'
    device_class: humidity
    default_entity_id: sensor.family_room_humidity
    name: Family_room humidity
    state: '{{ state_attr(''climate.family_room'', ''current_humidity'') }}'

- sensor:
    - name: "Cluster Status"
      state: >
        {% set nodes = [
          states('binary_sensor.node_orangepi5b_status'),
          states('binary_sensor.node_orangepi5b1_status'),
          states('binary_sensor.node_pve_status'),
          states('binary_sensor.qemu_haos_16_2_100_status'),
          states('sensor.ds723plus_volume_1_status')
        ] %}
        {% set healthy_states = ['on', 'true', '1', 'healthy', 'normal', 'ok', 'running', 'up'] %}
        {% set healthy_nodes = nodes | select('in', healthy_states) | list %}
        {% if healthy_nodes | count == nodes | count %}
          UP
        {% else %}
          DOWN ({{ healthy_nodes | count }}/{{ nodes | count }})
        {% endif %}
      icon: >
        {% if this.state == 'UP' %}
          mdi:check-circle
        {% else %}
          mdi:alert-circle
        {% endif %}

- sensor:
  - name: "ESP32 Temperature Safe"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    state: "{{ states('sensor.esp32_temperature_esp32_internal_temperature') | float(25.0) }}"

# WUNDERGROUND_REST
rest:
  - authentication: basic
    resource: !secret wunderground_url_forecast
    scan_interval: 300
    sensor:
      - name: "pws_forecast_narrative_today"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_narrative_today','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_today','daypart')[0].daypartName[0]) | default('Waiting', true)}}
                         {% endif %}
                         {% if state_attr('sensor.pws_forecast_narrative_today','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_today','daypart')[0].narrative[0]) | default('Waiting', true)}}
                         {% endif %}"
      - name: "pws_forecast_narrative_tonight"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_narrative_tonight','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_tonight','daypart')[0].daypartName[1])}}
                         {% endif %}
                         {% if state_attr('sensor.pws_forecast_narrative_tonight','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_tonight','daypart')[0].narrative[1])}}
                         {% endif %}"
      - name: "pws_forecast_narrative_tomorrow"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_narrative_tomorrow','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_tomorrow','daypart')[0].daypartName[2])}}
                         {% endif %}
                         {% if state_attr('sensor.pws_forecast_narrative_tomorrow','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_tomorrow','daypart')[0].narrative[2])}}
                         {% endif %}"
      - name: "pws_forecast_narrative_tomorrow_tonight"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_narrative_tomorrow_tonight','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_tomorrow_tonight','daypart')[0].daypartName[3])}}
                         {% endif %}
                         {% if state_attr('sensor.pws_forecast_narrative_tomorrow_tonight','daypart') == None %} {{'Waiting'}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_narrative_tomorrow_tonight','daypart')[0].narrative[3])}}
                         {% endif %}"
      - name: "pws_forecast_today"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_today','daypart') == None %} {{float('0')}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_today','daypart')[0].precipChance[0]) | default('0.0001', true)}}
                         {% endif %}"
      - name: "pws_forecast_tonight"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_tonight','daypart') == None %} {{float('0')}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_tonight','daypart')[0].precipChance[1])}}
                         {% endif %}"
      - name: "pws_forecast_tomorrow"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_tomorrow','daypart') == None %} {{float('0')}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_tomorrow','daypart')[0].precipChance[2])}}
                         {% endif %}"
      - name: "pws_forecast_tomorrow_tonight"
        json_attributes: "daypart"
        value_template: "{% if state_attr('sensor.pws_forecast_tomorrow_tonight','daypart') == None %} {{float('0')}}
                         {%- else -%} {{(state_attr('sensor.pws_forecast_tomorrow_tonight','daypart')[0].precipChance[3])}}
                         {% endif %}"



input_number:
  garden_watering_time:
    name: "Garden Watering Time"
    min: 0
    max: 90
    step: 1
    #mode: box
    unit_of_measurement: m
  lawn_watering_time:
    name: "Lawn Watering Time"
    min: 0
    max: 60
    step: 1
    #mode: box
    unit_of_measurement: m
  daily_calc_et:
    name: "Daily Calculated Evapotranspiration"
    min: 0
    max: 15
    step: 0.1
    mode: box
    unit_of_measurement: mm
  daily_rain_event:
    name: "Daily Rain Event"
    min: 0
    max: 50
    step: 0.1
    mode: box
    unit_of_measurement: mm
  daily_et:
    name: "Daily Evapotranspiration"
    min: 0
    max: 15
    step: 0.1
    mode: box
    unit_of_measurement: mm
  

input_text:
  opensprinkler_1_front_lawn_station_enabled_run_time: #Front Lawn West Irrigation
  opensprinkler_2_front_lawn_left_station_enabled_run_time: #Front Lawn East Irrigation
