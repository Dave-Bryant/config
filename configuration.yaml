  opensprinkler_4_back_lawn_north_station_enabled_run_time: #Back Lawn North Irrigation
  opensprinkler_7_east_side_front_gardens_station_enabled_run_time: #Front Garden
  opensprinkler_6_west_side_back_gardens_station_enabled_run_time: #Back & Side Garden
  opensprinkler_5_not_used_station_enabled_run_time:
  opensprinkler_1_front_lawn_station_enabled_run_date:
  opensprinkler_2_front_lawn_left_station_enabled_run_date:
  opensprinkler_3_back_lawn_south_station_enabled_run_date:
  opensprinkler_4_back_lawn_north_station_enabled_run_date:
  opensprinkler_7_east_side_front_gardens_station_enabled_run_date:
  opensprinkler_6_west_side_back_gardens_station_enabled_run_date:
  opensprinkler_5_not_used_station_enabled_run_date:
  opensprinkler_1_front_lawn_station_enabled_run_duration:
  opensprinkler_2_front_lawn_left_station_enabled_run_duration:
  opensprinkler_3_back_lawn_south_station_enabled_run_duration:
  opensprinkler_4_back_lawn_north_station_enabled_run_duration:
  opensprinkler_7_east_side_front_gardens_station_enabled_run_duration:
  opensprinkler_6_west_side_back_gardens_station_enabled_run_duration:
  opensprinkler_5_not_used_station_enabled_run_duration:

input_select:
  irrigation_status:
    name: 'Irrigation Status'
    options:
      - Normal
      - Rain is coming
      - No moisture lost yesterday
      - Irrigation run time too small
      - It has rained
      - Soil Moisture too high
    

input_boolean:
  garage_ac:
    name: input_boolean.garage_ac
    icon: mdi:air-conditioner
  garage_ac_cool:
    name: input_boolean.garage_ac_cool
    icon: mdi:snowflake
  garage_ac_fan_high:
    name: input_boolean.garage_ac_fan_high
    icon: mdi:fan
  garage_ac_fan_low:
    name: input_boolean.garage_ac_fan_low
    icon: mdi:fan
  garage_ac_reset:
    name: input_boolean.garage_ac_reset
    icon: mdi:air-conditioner
  check_act_garbage:
    name: input_boolean.check_act_garbage
  check_dams:
    name: input_boolean.check_dams
  force_irrigation:
    name: input_boolean.force_irrigation
  check_odometer:
    name: input_boolean.check_odometer
